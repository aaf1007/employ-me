    <meta name="description" property="og:description" content="Job Description As a Lead Software Developer for Trading, your primary role will be software development, where you will develop new and transform existing applications and APIs to fulfill the needs of RBC Wealth Management Front Office and other business stakeholders including end clients. You will be leading the technical design and development of cross-functional, multi-platform trading application systems and apply extensive, in-depth knowledge, skills, and practices to perform complex assignments. What will you do? Work within an Agile product team composed of technical and business team members responsible for building new functionality and enhancements. Create and review high-level and detailed technical designs based on business &amp;amp; system requirements. Recommend business solutions that satisfy sponsor/stakeholder needs, continually exploring and assessing value-added options. Together with Architects and SMEs, determine the best mix of development, interfacing applications, third party vendor solutions to meet project objectives. Contribute to successful project completion within budget and on time by identifying risks and developing/recommending mitigation strategies. Develop code and associated technical documentation as per the requirements and detailed design. Produce accurate estimates for completion of Technical Analysis, Design, Development, Testing and Acceptance phases of projects. Develop automated unit tests and execute testing while supporting QA and UAT testing. Use recommended processes and tools (for example, Confluence, Jira or its subsequent equivalents) to document requirements, design, track progress and issues. Effectively communicate and build rapport with team members including 3rd party vendor contractors, stakeholders and business partners from initiation to close. Facilitate small to large meetings and support information gathering sessions (e.g., JAD). What do you need to succeed? Must have Minimum 7 years of overall development experience in .NET technologies as a Software Engineer working within professional software engineering practices for the full software development life cycle, including coding standards, code reviews, source code management, build processes and testing with strong communication and interpersonal skills Solid understanding of software development concepts and best practices including data structures, algorithms and design patterns and OOPs. Advanced knowledge and proven experience designing and building web applications and APIs with .NET Core Experience developing stored procedures for SQL-based databases (e.g., MS SQL Server or Oracle) University or College Degree in Computer Science or a related field Nice-to-have: Experience with Front-end design and programming using UI technologies such as WPF, Angular, JS etc. Experience with cloud-based software development, specifically on Kubernetes. Experience with stream-based software development involving technologies such as Solace, Kafka, SignalR etc. Familiar with DevOps pipelines and related tools, e.g., Github Actions, Jira and Confluence What’s in it for you? We thrive on the challenge to be our best, progressive thinking to keep growing, and working together to deliver trusted advice to help our clients thrive and communities prosper. We care about each other, reaching our potential, making a difference to our communities, and achieving success that is mutual. A comprehensive Total Rewards Program including bonuses and flexible benefits, competitive compensation, commissions, and stock where applicable. Leaders who support your development through coaching and managing opportunities Ability to make a difference and lasting impact. Work in a dynamic, collaborative, progressive, and high-performing team. A world-class training program in financial services Flexible work/life balance options Opportunities to do challenging work. #LI-POST Job Skills .NET Core, .NET Core, .NET Technology, Agile Methodology, Algorithms, AngularJS, Apache Kafka, API Development, ASP.NET Core, C Sharp (Programming Language), Data Structures, Design, Detailed Design, DevOps, Engineering Practices, Front End Programming, Kubernetes, Object-Oriented Programming (OOP) Concepts, PL/SQL (Programming Language), REST API Development, RESTful API Design, SignalR, Software Design Patterns, Software Development, Software Development Life Cycle (SDLC) {+ 6 more} Additional Job Details Address: RBC CENTRE, 155 WELLINGTON ST W:TORONTO City: Toronto Country: Canada Work hours/week: 37.5 Employment Type: Full time Platform: TECHNOLOGY AND OPERATIONS Job Type: Regular Pay Type: Salaried Posted Date: 2026-10-08 Application Deadline: 2026-11-13 Note: Applications will be accepted until 11:59 PM on the day prior to the application deadline date above Our Employment Opportunities At RBC, we are guided by living shared values of Client First, Integrity, Collaboration, Respect and Excellence and winning together as One RBC. We believe an inclusive workplace that has diverse perspectives is core to our continued growth as one of the largest and most successful banks in the world. Maintaining a workplace where our employees feel supported to perform at their best, effectively collaborate, drive innovation, and grow professionally helps to bring our Purpose to life and create value for our clients and communities. RBC strives to deliver this through policies and programs intended to foster a workplace based on respect, belonging and opportunity for all. Join our Talent Community Stay in-the-know about great career opportunities at RBC. Sign up and get customized info on our latest jobs, career tips and Recruitment events that matter to you. Expand your limits and create a new future together at RBC. Find out how we use our passion and drive to enhance the well-being of our clients and communities at jobs.rbc.com. RBC is presently inviting candidates to apply for this existing vacancy. Applying to this posting allows you to express your interest in this current career opportunity at RBC. Qualified applicants may be contacted to review their resume in more detail. Royal Bank of Canada is a global financial institution with a purpose-driven, principles-led approach to delivering leading performance. Our success comes from the 84,000+ employees who bring our vision, values and strategy to life so we can help our clients thrive and communities prosper. As Canada’s biggest bank, and one of the largest in the world based on market capitalization, we have a diversified business model with a focus on innovation and providing exceptional experiences to more than 16 million clients in Canada, the U.S. and 34 other countries. Learn more at rbc.com.‎ We are proud to support a broad range of community initiatives through donations, community investments and employee volunteer activities. See how at rbc.com/community-social-impact.">
