  <meta name="description" content="1Password is growing. We’ve surpassed $500M in ARR and we’re continuing to accelerate, earning a spot on the Forbes Cloud 100 for four years in a row and teaming up with iconic partners like Oracle Red Bull Racing.

About 1Password

At 1Password, we’re building the foundation for a safe, productive digital future. Our mission is to unleash employee productivity without compromising security by ensuring every identity is authentic, every application sign-in is secure, and every device is trusted. We innovated the market-leading enterprise password manager and pioneered Unified Access Management, a new cybersecurity category built for the way people and AI agents work today. As one of the most loved brands in cybersecurity, we take a human-centric approach in everything from product strategy to user experience. Over 180,000 businesses, from Fortune 100 leaders to the world’s most innovative AI companies, trust 1Password to help their teams securely adopt the SaaS and AI tools they need to do their best work.

If you&#39;re excited about the opportunity to contribute to the digital safety of millions, to work alongside a team of curious, driven individuals, and to solve hard problems in a fast-paced, dynamic environment, then we want to hear from you. Come join us and help shape a safer, simpler digital future.

At 1Password, we believe everyone deserves to be safe online. As a Senior GTM Engineering Analyst, you’ll build artificial intelligence (AI) agents, data products, and analysis workflows that help global go-to-market teams work faster and make better decisions.

You’ll connect information across business systems, automate repetitive processes, and create reliable insights for leaders across Sales, Solutions, Customer Experience, and Channel. Your work will help make security simpler and more human-centric for the millions of people and thousands of businesses that rely on 1Password. This role reports to the Director, GTM Engineering (Revenue Operations)

How we’re using AI today

Across GTM, we’re transforming the way we work with AI. We expect every seller, CSM, and team member to become a power user, using it daily to work smarter and move faster. AI is already embedded in how we operate – from real-time coaching that sharpens how we sell and interact with customers, to surfacing insights that help us anticipate needs – creating more time for meaningful customer engagement. If you’re excited to reshape how you think, make decisions, and drive growth with AI, you’ll feel right at home here.

This is a remote opportunity within Canada and the US.

Note: All go-to market roles will have an in-person onboarding in Toronto.

What we&#39;re looking for:

 - Bring 4+ years of experience in analytics, revenue operations, sales operations, data analysis, or a related field.

 - Have experience building AI agents or workflows powered by large language models (LLMs) that have been used in real business work.

 - Experience building and maintaining decision-ready dashboards, reports, and data products in Power BI or comparable business intelligence tools, including data modeling, visualization, metric definition, and ongoing maintenance for GTM stakeholders

 - Work confidently with AI coding tools such as Claude Code, Codex, or Cursor.

 - Use Structured Query Language (SQL) effectively and apply working knowledge of statistics to distinguish meaningful results from noise.

 - Document and improve business processes with a focus on reducing manual work and improving decision-making.

Bonus points for:

 - Have experience with Python for building automations, working with application programming interfaces (APIs), and connecting systems, along with go-to-market tools such as Salesforce, Snowflake, Databricks, dbt, or business intelligence platforms.

 - Have supported channel or partner sales motions, worked across multiple regions, or studied a quantitative discipline such as science, engineering, statistics, or mathematics.

What you can expect:

 - Rebuild sales and revenue operations processes to reduce manual work.

 - Build and maintain AI agents that prepare call and deal briefs, draft customer follow-ups, rank target accounts, and flag deals that need attention.

 - Build and maintain data tables and scheduled analysis jobs that combine information from Salesforce, Gong, and other go-to-market systems.

 - Create reports, alerts, and weekly manager briefs used by sales leadership.

 -  Partner with Sales, Solutions, Customer Experience, Channel, and Revenue Operations teams to understand business needs and define clear technical requirements.

 - Map existing go-to-market processes, identify opportunities to improve data quality and efficiency, and help teams make better decisions.

 - Evaluate AI-generated outputs for quality, accuracy, privacy, data access, and appropriate safeguards; measure adoption and effectiveness, then improve workflows based on feedback and results.

USA-based roles only: The annual base salary for this role is between $113,000 USD and $146,000 USD.  This role is also eligible for immediate participation in 1Password&#39;s benefits program (health, dental, 401k and many others), utilization of our generous paid time off, an equity grant and, where applicable, participation in our incentive programs.

Canada-based roles only: The annual base salary for this role is between $105,000 CAD and $136,000 CAD. This role is also eligible for immediate participation in 1Password’s generous benefits program (health, dental, RRSP and many others), utilization of our generous paid time off, an equity grant and, where applicable, participation in our incentive programs.



At 1Password, we approach each individual&#39;s compensation with a promise of fair market value and internal equity commensurate with experience and specific skill set.

This posting is for an existing vacancy.



Our culture 
At 1Password, we prioritize collaboration, clear and transparent communication, receptiveness to feedback, and alignment with our core values: keep it simple, lead with honesty, and put people first. 

You’ll be part of a team that challenges the status quo, and is excited to experiment and iterate in search of the best solution. That said, 1Password is not for everyone https://blog.1password.com/inside-the-culture-powering-1passwords-next-chapter/. Our work is demanding, we strive for excellence, and the pace is fast. We need people who are keen to take on challenging problems, who seek feedback to grow, and who are driven to make an impact. If you&#39;re looking for a place where you can settle into a comfortable routine, this might not be the right fit for you. We’re looking for individuals who are proven experts in their fields, as well as those who are highly adaptable, can thrive in ambiguity and through change, are curious, and above all deliver results. 

How we work with AI
We are committed to leveraging cutting-edge technology—including AI—to achieve our mission. We also understand that thinking critically about AI in its current forms will help us create better solutions for our customers and ourselves with its future forms, which will help us continue to close the gap between security and privacy and achieve our mission. We want team members at all levels to take the approach of actively learning AI best practices, identifying opportunities to apply AI in meaningful ways, and driving innovative solutions in their daily work. Embracing the future of AI isn&#39;t just encouraged—it&#39;s an essential part of how we will be successful at 1Password.

This approach extends to our hiring process—candidates are welcome to use AI tools responsibly and thoughtfully during the application process. To us, this means we do ask that you join live interviews without using AI tools so we can get to know how you communicate, solve problems, and collaborate with others.


Our approach to work
We recognize the power of both in person collaboration and remote work. Some roles are designated as remote-first, with an expectation that individuals work from their homes majority of the time, while others are designated as in-office roles, with an expectation of being on-site on a regular basis. We recognize that certain roles benefit from regular, in-person connection to support collaboration, team cohesion, and customer engagement.

For all roles, occasional travel may be required. This includes things like: department-wide offsites, quarterly department meetings and periodic customer events. These events are typically held in varying locations across Canada, USA and/or EMEA. In leadership roles, you can expect to travel once per month on average.

Note: All go-to market roles will have an in-person onboarding in Toronto. 


What we offer
We believe in working hard, and rewarding that hard work through our benefits. While not an exhaustive list, here is a glance at what we currently offer: 

Health and wellbeing
👶 Maternity and parental leave top-up programs
🩺 Competitive health benefits
🏝 Generous PTO policy 

 Growth and future 
📈 RSU program for most employees
💸 Retirement matching program
🔑 Free 1Password account

Community 
🤝 Paid volunteer days 
🏆 Peer-to-peer recognition through Bonusly
🌎 Remote-first work environment
*Some roles in our GTM team are currently being hired for in-person hybrid work in Toronto and Austin. These roles will specify on the posting.

You belong here.

1Password is proud to be an equal opportunity employer. We are committed to fostering an inclusive, diverse and equitable workplace that is built on trust, support and respect. We welcome all individuals and do not discriminate on the basis of gender identity and expression, race, ethnicity, disability, sexual orientation, colour, religion, creed, gender, national origin, age, marital status, pregnancy, sex, citizenship, education, languages spoken or veteran status. Be yourself, find your people and share the things you love.

Accommodation is available upon request at any point during our recruitment process. If you require an accommodation, please speak to your talent acquisition partner or email us at nextbit@agilebits.com and we’ll work to meet your needs.

Remote work is a part of our DNA. Given that our company was founded remotely in 2005, we can safely say we&#39;re experts at building remote culture. That said, remote work at 1Password does mean working from your home country. If you&#39;ve got questions or concerns about this, your talent partner would be happy to address them with you.

Successful applicants will be required to complete a background check that may consist of prior employment verification, reference checks, education confirmation, criminal background, publicly available social media, credit history, or other information, as permitted by local law.

    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior GTM Engineering Analyst","description":"<p style=\"min-height:1.5em\"><em><strong>1Password is growing.</strong> We’ve surpassed $500M in ARR and we’re continuing to accelerate, earning a spot on the Forbes Cloud 100 for four years in a row and teaming up with iconic partners like Oracle Red Bull Racing.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About 1Password</strong></p><p style=\"min-height:1.5em\"><em>At 1Password, we’re building the foundation for a safe, productive digital future. Our mission is to unleash employee productivity without compromising security by ensuring every identity is authentic, every application sign-in is secure, and every device is trusted. We innovated the market-leading enterprise password manager and pioneered Unified Access Management, a new cybersecurity category built for the way people and AI agents work today. As one of the most loved brands in cybersecurity, we take a human-centric approach in everything from product strategy to user experience. Over 180,000 businesses, from Fortune 100 leaders to the world’s most innovative AI companies, trust 1Password to help their teams securely adopt the SaaS and AI tools they need to do their best work.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>If you're excited about the opportunity to contribute to the digital safety of millions, to work alongside a team of curious, driven individuals, and to solve hard problems in a fast-paced, dynamic environment, then we want to hear from you. Come join us and help shape a safer, simpler digital future.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">At 1Password, we believe everyone deserves to be safe online. As a Senior GTM Engineering Analyst, you’ll build artificial intelligence (AI) agents, data products, and analysis workflows that help global go-to-market teams work faster and make better decisions.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">You’ll connect information across business systems, automate repetitive processes, and create reliable insights for leaders across Sales, Solutions, Customer Experience, and Channel. Your work will help make security simpler and more human-centric for the millions of people and thousands of businesses that rely on 1Password. This role reports to the Director, GTM Engineering (Revenue Operations)</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>How we’re using AI today</strong></p><p style=\"min-height:1.5em\">Across GTM, we’re transforming the way we work with AI. We expect every seller, CSM, and team member to become a power user, using it daily to work smarter and move faster. AI is already embedded in how we operate – from real-time coaching that sharpens how we sell and interact with customers, to surfacing insights that help us anticipate needs – creating more time for meaningful customer engagement. If you’re excited to reshape how you think, make decisions, and drive growth with AI, you’ll feel right at home here.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">This is a remote opportunity within Canada and the US.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">Note: All go-to market roles will have an in-person onboarding in Toronto.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What we're looking for:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Bring 4+ years of experience in analytics, revenue operations, sales operations, data analysis, or a related field.</p></li><li><p style=\"min-height:1.5em\">Have experience building AI agents or workflows powered by large language models (LLMs) that have been used in real business work.</p></li><li><p style=\"min-height:1.5em\">Experience building and maintaining decision-ready dashboards, reports, and data products in Power BI or comparable business intelligence tools, including data modeling, visualization, metric definition, and ongoing maintenance for GTM stakeholders</p></li><li><p style=\"min-height:1.5em\">Work confidently with AI coding tools such as Claude Code, Codex, or Cursor.</p></li><li><p style=\"min-height:1.5em\">Use Structured Query Language (SQL) effectively and apply working knowledge of statistics to distinguish meaningful results from noise.</p></li><li><p style=\"min-height:1.5em\">Document and improve business processes with a focus on reducing manual work and improving decision-making.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Bonus points for:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Have experience with Python for building automations, working with application programming interfaces (APIs), and connecting systems, along with go-to-market tools such as Salesforce, Snowflake, Databricks, dbt, or business intelligence platforms.</p></li><li><p style=\"min-height:1.5em\">Have supported channel or partner sales motions, worked across multiple regions, or studied a quantitative discipline such as science, engineering, statistics, or mathematics.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What you can expect:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Rebuild sales and revenue operations processes to reduce manual work.</p></li><li><p style=\"min-height:1.5em\">Build and maintain AI agents that prepare call and deal briefs, draft customer follow-ups, rank target accounts, and flag deals that need attention.</p></li><li><p style=\"min-height:1.5em\">Build and maintain data tables and scheduled analysis jobs that combine information from Salesforce, Gong, and other go-to-market systems.</p></li><li><p style=\"min-height:1.5em\">Create reports, alerts, and weekly manager briefs used by sales leadership.</p></li><li><p style=\"min-height:1.5em\"> Partner with Sales, Solutions, Customer Experience, Channel, and Revenue Operations teams to understand business needs and define clear technical requirements.</p></li><li><p style=\"min-height:1.5em\">Map existing go-to-market processes, identify opportunities to improve data quality and efficiency, and help teams make better decisions.</p></li><li><p style=\"min-height:1.5em\">Evaluate AI-generated outputs for quality, accuracy, privacy, data access, and appropriate safeguards; measure adoption and effectiveness, then improve workflows based on feedback and results.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">USA-based roles only: The annual base salary for this role is between $113,000 USD and $146,000 USD.  This role is also eligible for immediate participation in 1Password's benefits program (health, dental, 401k and many others), utilization of our generous paid time off, an equity grant and, where applicable, participation in our incentive programs.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">Canada-based roles only: The annual base salary for this role is between $105,000 CAD and $136,000 CAD. This role is also eligible for immediate participation in 1Password’s generous benefits program (health, dental, RRSP and many others), utilization of our generous paid time off, an equity grant and, where applicable, participation in our incentive programs.</p><p style=\"min-height:1.5em\"><br /><br />At 1Password, we approach each individual's compensation with a promise of fair market value and internal equity commensurate with experience and specific skill set.<br /><br /><em>This posting is for an existing vacancy.</em><br /></p><p style=\"min-height:1.5em\"><br /><strong>Our culture </strong><br />At 1Password, we prioritize collaboration, clear and transparent communication, receptiveness to feedback, and alignment with our core values: keep it simple, lead with honesty, and put people first. <br /><br />You’ll be part of a team that challenges the status quo, and is excited to experiment and iterate in search of the best solution. That said, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.1password.com/inside-the-culture-powering-1passwords-next-chapter/\"><em>1Password is not for everyone</em></a>. Our work is demanding, we strive for excellence, and the pace is fast. We need people who are keen to take on challenging problems, who seek feedback to grow, and who are driven to make an impact. If you're looking for a place where you can settle into a comfortable routine, this might not be the right fit for you. We’re looking for individuals who are proven experts in their fields, as well as those who are highly adaptable, can thrive in ambiguity and through change, are curious, and above all deliver results. <br /><br /><strong>How we work with AI</strong><br />We are committed to leveraging cutting-edge technology—including AI—to achieve our mission. We also understand that thinking critically about AI in its current forms will help us create better solutions for our customers and ourselves with its future forms, which will help us continue to close the gap between security and privacy and achieve our mission. We want team members at all levels to take the approach of actively learning AI best practices, identifying opportunities to apply AI in meaningful ways, and driving innovative solutions in their daily work. Embracing the future of AI isn't just encouraged—it's an essential part of how we will be successful at 1Password.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">This approach extends to our hiring process—candidates are welcome to use AI tools responsibly and thoughtfully during the application process. To us, this means we do ask that you join live interviews without using AI tools so we can get to know how you communicate, solve problems, and collaborate with others.<br /><br /><br /><strong>Our approach to work</strong><br />We recognize the power of both in person collaboration and remote work. Some roles are designated as remote-first, with an expectation that individuals work from their homes majority of the time, while others are designated as in-office roles, with an expectation of being on-site on a regular basis. We recognize that certain roles benefit from regular, in-person connection to support collaboration, team cohesion, and customer engagement.<br /><br />For all roles, occasional travel may be required. This includes things like: department-wide offsites, quarterly department meetings and periodic customer events. These events are typically held in varying locations across Canada, USA and/or EMEA. In leadership roles, you can expect to travel once per month on average.<br /><br />Note: All go-to market roles will have an in-person onboarding in Toronto. <br /><br /><br /><strong>What we offer</strong><br />We believe in working hard, and rewarding that hard work through our benefits. While not an exhaustive list, here is a glance at what we currently offer: <br /><br /><em>Health and wellbeing</em><br />👶 Maternity and parental leave top-up programs<br />🩺 Competitive health benefits<br />🏝 Generous PTO policy <br /><br /><em> Growth and future </em><br />📈 RSU program for most employees<br />💸 Retirement matching program<br />🔑 Free 1Password account<br /><br /><em>Community </em><br />🤝 Paid volunteer days <br />🏆 Peer-to-peer recognition through Bonusly<br />🌎 Remote-first work environment<br /><em>*Some roles in our GTM team are currently being hired for in-person hybrid work in Toronto and Austin. These roles will specify on the posting.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>You belong here.</strong></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>1Password is proud to be an equal opportunity employer. We are committed to fostering an inclusive, diverse and equitable workplace that is built on trust, support and respect. We welcome all individuals and do not discriminate on the basis of gender identity and expression, race, ethnicity, disability, sexual orientation, colour, religion, creed, gender, national origin, age, marital status, pregnancy, sex, citizenship, education, languages spoken or veteran status. Be yourself, find your people and share the things you love.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Accommodation is available upon request at any point during our recruitment process. If you require an accommodation, please speak to your talent acquisition partner or email us at nextbit@agilebits.com and we’ll work to meet your needs.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Remote work is a part of our DNA. Given that our company was founded remotely in 2005, we can safely say we're experts at building remote culture. That said, remote work at 1Password does mean working from your home country. If you've got questions or concerns about this, your talent partner would be happy to address them with you.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Successful applicants will be required to complete a background check that may consist of prior employment verification, reference checks, education confirmation, criminal background, publicly available social media, credit history, or other information, as permitted by local law.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>1Password uses artificial intelligence (AI) and machine learning (ML) technologies, including natural language processing and predictive analytics, to assist in the initial screening of employment applications and improve our recruitment process. See </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.ashbyhq.com/downloadables/ashby-bias-audit-08-2024.pdf\"><em><u>here</u></em></a><em> for the latest third party bias audit information. If you prefer not to have your application assessed using AI/ML features, you may opt out by completing </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://jobs.ashbyhq.com/1password/automation-notice\"><em><u>this form</u></em></a><em>. For additional information see our </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://1password.com/files/candidate-privacy-notice.pdf\"><em><u>Candidate Privacy Notice</u></em></a><em>.</em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"1Password","value":"6f78b170-9600-4b2d-9682-feead160100d"},"datePosted":"2026-10-26","hiringOrganization":{"@type":"Organization","name":"1Password","sameAs":"https://1password.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/b8833a99-53c9-4b1c-9e2d-dd2b7952c640/bd5cff34-571d-4e8b-bf53-7f9bcef57d29/3119f472-35f1-4a3f-9d31-f4c9f5e8f91b.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":""}},"employmentType":"FULL_TIME","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":""}}</script>
