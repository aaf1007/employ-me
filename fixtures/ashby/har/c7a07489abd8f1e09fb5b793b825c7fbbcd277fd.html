  <meta name="description" content="ABOUT THE TEAM

The Applied team safely brings OpenAI&#39;s technology to the world. We released ChatGPT; Plugins; DALL·E; and the APIs for GPT-5, embeddings, and fine-tuning. We also operate inference infrastructure at scale. There&#39;s a lot more on the immediate horizon.

Our customers build fast-growing businesses around our APIs, which power product features that were never before possible. ChatGPT is a prime example of what is currently possible. We simultaneously ensure that our powerful tools are used responsibly. Safe deployment is more important to us than unfettered growth.

The Fraud Engineering team works within our Applied Engineering organization identifying and responding to fraudsters on our platform. We are looking for a software engineer with anti fraud &amp; abuse experience to help architect and build our next-generation anti-fraud systems.


ABOUT THE ROLE

The Scaled Abuse team protects OpenAI’s products and customers by detecting, preventing, and responding to fraudulent and abusive behavior at scale. We build and operate the backend and data systems that power real-time detection, investigation workflows, and enforcement — balancing strong protections with a great user experience as the platform grows.

Our work sits at the intersection of engineering and abuse expertise: we partner closely with Trust &amp; Safety, Security, and Product to understand emerging attack patterns, translate messy signals into clear system behavior, and continuously harden our defenses. The problems are dynamic and ambiguous by default, so we value engineers who can quickly dive into an unfamiliar codebase, develop strong intuition about how it works end-to-end, and propose pragmatic improvements that make the entire stack more resilient.


IN THIS ROLE, YOU WILL:

 - Design and build systems for fraud detection and remediation while balancing fraud loss, cost of implementation, and customer experience

 - Work closely with finance, security, product, research, and trust &amp; safety operations to holistically combat fraudulent and abusive actors on our system

 - Stay abreast of the latest techniques and tools to stay several steps ahead of determined and well resourced adversaries

 - Utilize GPT-5 and future models to more effectively combat fraud and abuse


YOU MIGHT THRIVE IN THIS ROLE IF YOU:

 - Have at least 5 years of software engineering experience in backend and data systems.

 - Have at least 2 years experience in fraud or abuse analysis, investigation, and/or operations

 - Can dive into our codebase, intuit how it works, and be able to have a strong intuition for suggestions that will lead us to a stronger engineering position.

 - A voracious and intrinsic desire to learn and fill in missing skills. An equally strong talent for sharing that information clearly and concisely with others

 - Are comfortable with ambiguity and rapidly changing conditions. You view changes as an opportunity to add structure and order when necessary

 - Experience in Machine Learning techniques is a plus, but not required

Our tech stack

Our infrastructure is built on Terraform, Kubernetes, Azure, Python, Postgres, and Kafka. While we value experience with these technologies, we are primarily looking for engineers with strong technical skills and the ability to quickly pick up new tools and frameworks.

About OpenAI

OpenAI is an AI research and deployment company dedicated to ensuring that general-purpose artificial intelligence benefits all of humanity. We push the boundaries of the capabilities of AI systems and seek to safely deploy them to the world through our products. AI is an extremely powerful tool that must be created with safety and human needs at its core, and to achieve our mission, we must encompass and value the many different perspectives, voices, and experiences that form the full spectrum of humanity. 

We are an equal opportunity employer, and we do not discriminate on the basis of race, religion, color, national origin, sex, sexual orientation, age, veteran status, disability, genetic information, or other applicable legally protected characteristic. 

For additional information, please see OpenAI’s Affirmative Action and Equal Employment Opportunity Policy Statement https://cdn.openai.com/policies/eeo-policy-statement.pdf.

Background checks for applicants will be administered in accordance with applicable law, and qualified applicants with arrest or conviction records will be considered for employment consistent with those laws, including the San Francisco Fair Chance Ordinance, the Los Angeles County Fair Chance Ordinance for Employers, and the California Fair Chance Act, for US-based candidates. For unincorporated Los Angeles County workers: we reasonably believe that criminal history may have a direct, adverse and negative relationship with the following job duties, potentially resulting in the withdrawal of a conditional offer of employment: protect computer hardware entrusted to you from theft, loss or damage; return all computer hardware in your possession (including the data contained therein) upon termination of employment or end of assignment; and maintain the confidentiality of proprietary, confidential, and non-public information. In addition, job duties require access to secure and protected information technology systems and related data security obligations.

To notify OpenAI that you believe this job posting is non-compliant, please submit a report through this form https://form.asana.com/?d=57018692298241&amp;k=5MqR40fZd7jlxVUh5J-UeA. No response will be provided to inquiries unrelated to job posting compliance.

We are committed to providing reasonable accommodations to applicants with disabilities, and requests can be made via this link https://form.asana.com/?k=bQ7w9h3iexRlicUdWRiwvg&amp;d=57018692298241.

OpenAI Global Applicant Privacy Policy https://cdn.openai.com/policies/global-employee-and-contractor-privacy-policy.pdf

lp architect and build our next-generation anti-fraud systems.</p><p style=\"min-height:1.5em\"></p><h2><strong>About the role</strong></h2><p style=\"min-height:1.5em\">The Scaled Abuse team protects OpenAI’s products and customers by detecting, preventing, and responding to fraudulent and abusive behavior at scale. We build and operate the backend and data systems that power real-time detection, investigation workflows, and enforcement — balancing strong protections with a great user experience as the platform grows.</p><p style=\"min-height:1.5em\">Our work sits at the intersection of engineering and abuse expertise: we partner closely with Trust &amp; Safety, Security, and Product to understand emerging attack patterns, translate messy signals into clear system behavior, and continuously harden our defenses. The problems are dynamic and ambiguous by default, so we value engineers who can quickly dive into an unfamiliar codebase, develop strong intuition about how it works end-to-end, and propose pragmatic improvements that make the entire stack more resilient.</p><p style=\"min-height:1.5em\"></p><h2><strong>In this role, you will:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Design and build systems for fraud detection and remediation while balancing fraud loss, cost of implementation, and customer experience</p></li><li><p style=\"min-height:1.5em\">Work closely with finance, security, product, research, and trust &amp; safety operations to holistically combat fraudulent and abusive actors on our system</p></li><li><p style=\"min-height:1.5em\">Stay abreast of the latest techniques and tools to stay several steps ahead of determined and well resourced adversaries</p></li><li><p style=\"min-height:1.5em\">Utilize GPT-5 and future models to more effectively combat fraud and abuse</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>You might thrive in this role if you:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Have at least 5 years of software engineering experience in backend and data systems.</p></li><li><p style=\"min-height:1.5em\">Have at least 2 years experience in fraud or abuse analysis, investigation, and/or operations</p></li><li><p style=\"min-height:1.5em\">Can dive into our codebase, intuit how it works, and be able to have a strong intuition for suggestions that will lead us to a stronger engineering position.</p></li><li><p style=\"min-height:1.5em\">A voracious and intrinsic desire to learn and fill in missing skills. An equally strong talent for sharing that information clearly and concisely with others</p></li><li><p style=\"min-height:1.5em\">Are comfortable with ambiguity and rapidly changing conditions. You view changes as an opportunity to add structure and order when necessary</p></li><li><p style=\"min-height:1.5em\">Experience in Machine Learning techniques is a plus, but not required</p></li></ul><p style=\"min-height:1.5em\"><strong>Our tech stack</strong></p><p style=\"min-height:1.5em\">Our infrastructure is built on Terraform, Kubernetes, Azure, Python, Postgres, and Kafka. While we value experience with these technologies, we are primarily looking for engineers with strong technical skills and the ability to quickly pick up new tools and frameworks.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About OpenAI</strong></p><p style=\"min-height:1.5em\">OpenAI is an AI research and deployment company dedicated to ensuring that general-purpose artificial intelligence benefits all of humanity. We push the boundaries of the capabilities of AI systems and seek to safely deploy them to the world through our products. AI is an extremely powerful tool that must be created with safety and human needs at its core, and to achieve our mission, we must encompass and value the many different perspectives, voices, and experiences that form the full spectrum of humanity. </p><p style=\"min-height:1.5em\">We ar d to job posting compliance.</p><p style=\"min-height:1.5em\">We are committed to providing reasonable accommodations to applicants with disabilities, and requests can be made via this <a target=\"_blank\" rel=\"noopener noreferrer\" class=\"c-link c-link--underline\" href=\"https://form.asana.com/?k=bQ7w9h3iexRlicUdWRiwvg&amp;d=57018692298241\"><u>link</u></a>.</p><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"c-link\" href=\"https://cdn.openai.com/policies/global-employee-and-contractor-privacy-policy.pdf\">OpenAI Global Applicant Privacy Policy</a></p><p style=\"min-height:1.5em\">At OpenAI, we believe artificial intelligence has the potential to help people solve immense global challenges, and we want the upside of AI to be widely shared. Join us in shaping the future of technology.</p>","isListed":true,"isConfidential":false,"teamNames":["Applied AI","Applied AI Engineering"],"secondaryLocationNames":[],"compensationTierSummary":"$266K – $445K • Offers Equity","compensationTiers":[{"id":"62bccc91-658d-42ba-a8b7-4555a960d645","title":null,"tierSummary":"$266K – $445K • Offers Equity","__typename":"JobPostingCompensationTiers"}],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":"$266K - $445K","compensationPhilosophyHtml":"<p style=\"min-height:1.5em\">The base pay offered may vary depending on multiple individualized factors, including market location, job-related knowledge, skills, and experience. If the role is non-exempt, overtime pay will be provided consistent with applicable laws.  In addition to the salary range listed above, total compensation also includes generous equity, performance-related bonus(es) for eligible employees, and the following benefits.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Medical, dental, and vision insurance for you and your family, with employer contributions to Health Savings Accounts</p></li><li><p style=\"
