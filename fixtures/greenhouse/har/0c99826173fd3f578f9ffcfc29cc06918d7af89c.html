      <script id='data-job' type='text/template'>
        {"id":8258279,"title":"2027 - Software Engineer Intern, Dublin - 6 Month Internship","location":{"name":"Dublin"},"content":"<p>**This is a 6 month internship starting in January 2027**<br><br>We’re seeking curious minds like yours to collaborate with full-time engineers and cross functional teammates, learn development standard methodologies, and gain practical software engineering experience. <br><br>Software engineering interns are fully integrated into software engineering teams across our Product and Technology organization. Interns spend their time pushing production-level code to make lasting contributions across MongoDB’s products and services for our internal teams, external customers, and developer end users.</p>\n<h3>What we are looking for in you (qualifications)</h3>\n<ul>\n<li>In the process of receiving a Bachelor’s or Master's degree in Computer Science, Computer Engineering, or a related field.</li>\n<li>Have a foundation in computer science theory, with proficiencies in data structures, algorithms, and software design.</li>\n<li>Fluent in any one of the following programming languages: Java, Python, Go, C++, Javascript, Node.js - or a comparable object-oriented programming language.</li>\n<li>Have a minimum of one semester remaining in university studies after the internship concludes. Graduation date in, Spring 2028 or Summer 2028.</li>\n<li>Must be authorized to work in Ireland and provide the Company with copies of all relevant documents, if requested. Company sponsorship may be available for eligible candidates applying for certain roles.</li>\n</ul>\n<h3>What you'll find at MongoDB</h3>\n<ul>\n<li>Authentic Culture: A workplace where you are encouraged to bring your whole self to work, we believe that Embracing the Power of Differences is the best way to broaden our own perspectives and foster innovation.</li>\n<li>Personalized Mentorship: Pair up with an engineering Mentor, a Program Advisor from the Early Talent Recruitment Team, and an<a href=\"https://www.mongodb.com/careers/diversity-and-inclusion\"> Employee Resource Group</a> (ERG) Guide to foster your growth.</li>\n<li>Career Coaching Sessions: Access to a tailored training program designed uniquely for interns’ personal and professional development.</li>\n<li>Work-Life Harmony: Embrace \"Bloom for Interns\" with access to mental and physical health benefits, paid time off, free lunch, and more!</li>\n<li>Impactful Projects: Contribute to projects where you can Make it Matter - your meaningful work will see the light of day.</li>\n<li>Exclusive Networking: Attend \"Speaker Series\" and \"Roundtables\" to connect with our executives and departmental leaders.</li>\n<li>Vibrant Community: Build connections with fellow interns and join after-work social events, virtual gatherings, and local city activities to create connections and friendships.</li>\n<li>Path to Full-Time: A chance to see if MongoDB is where you see yourself long term with the possibility of receiving a full time offer at the end of the internship!</li>\n</ul>\n<p>MongoDB internships are full-time (40 hours/week). The internship is a fixed term program, the start date will be January 2027 for a duration of 6 months. All interns are considered hybrid employees, designated the \"in office\" working model and are expected to be in their office location 3-5 days a week.</p>\n<p>Due to the high volume of applications our Early Talent Recruitment Team receives, it may take up to six weeks to hear back regarding an update on your application status. Our goal is to get back sooner, but we appreciate your patience as our team carefully reviews each application.</p>\n<h3>About MongoDB</h3>\n<p>MongoDB is built for change, empowering our customers and our people to innovate at the speed of the market. We have redefined the data platform for the AI era, enabling builders to create, transform, and disrupt industries with software. MongoDB’s unified data platform, the most widely available, globally distributed data platform on the market, helps organizations modernize legacy workloads, embrace innovation, and unleash AI. Our cloud-native platform, MongoDB Atlas, is the only globally distributed, multi-cloud data platform and is available across AWS, Google Cloud, and Microsoft Azure.</p>\n<p>With offices worldwide and over 67,000 customers, including AI-native startups and approximately 75% of the Fortune 100, relying on MongoDB for their most important applications, we’re powering the next era of software.</p>\n<p>Our compass at MongoDB is our <a href=\"https://www.mongodb.com/company\">Leadership Commitment,</a> guiding how and why we make decisions, show up for each other, and win. It’s what makes us MongoDB.&nbsp;</p>\n<p>To drive the personal growth and business impact of our employees, we’re committed to developing a supportive and enriching culture for everyone. <a href=\"https://www.mongodb.com/company/blog/culture/employee-benefits-that-make-a-difference-at-mongodb\">From employee affinity groups, to fertility assistance and a generous parental leave policy</a>, we value our employees’ wellbeing and want to support them along every step of their professional and personal journeys.<a href=\"https://www.mongodb.com/blog/channel/culture\"> Learn more about what it’s like to work at MongoDB</a>, and help us make an impact on the world!</p>\n<p>MongoDB is committed to providing any necessary accommodations for individuals with disabilities within our application and interview process. To request an accommodation due to a disability, please inform your recruiter.</p>\n<p>MongoDB is an equal opportunities employer.</p>\n<p><em>Req ID: 426470</em></p>","salary":[{"id":22194060,"name":"Position ID","value":"n/a","value_type":"short_text"},{"id":24918,"name":"Department ID","value":"D26100-R&D Interns","value_type":"single_select"},{"id":22194061,"name":"Team","value":"268-ENG Interns","value_type":"single_select"},{"id":4914027,"name":"Region","valu
