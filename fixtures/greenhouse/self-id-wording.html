<!doctype html>
<!-- Synthetic, for e2e/self-id-mapping.spec.ts: a Greenhouse-shaped form with
     a voluntary self-identification question in words the rules don't know,
     whose options don't use the usual wording either. Not a recorded form. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Application for Data Engineer at Acme</title>
  </head>
  <body>
    <h1>Data Engineer</h1>
    <form id="application-form" method="post" action="/acme/jobs/7654322">
      <label for="first_name">First Name *</label>
      <input id="first_name" name="first_name" type="text" required />
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />
      <label for="question_3001">Which of these best describes your heritage?</label>
      <select id="question_3001" name="question_3001">
        <option value="">Select...</option>
        <option value="1">East or South Asian</option>
        <option value="2">European</option>
        <option value="3">Mixed heritage</option>
        <option value="4">Skip this question</option>
      </select>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
