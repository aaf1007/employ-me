<!doctype html>
<!-- Synthetic, trivial Greenhouse-shaped form for harness smoke tests. Real
     saved forms go next to it as <employer>-<yyyy-mm-dd>.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Application for Software Engineer at Acme</title>
  </head>
  <body>
    <h1>Software Engineer</h1>
    <form id="application-form" method="post" action="/acme/jobs/1234567">
      <label for="first_name">First Name *</label>
      <input id="first_name" name="first_name" type="text" autocomplete="given-name" required />
      <label for="last_name">Last Name *</label>
      <input id="last_name" name="last_name" type="text" autocomplete="family-name" required />
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <label for="resume">Resume/CV *</label>
      <input id="resume" name="resume" type="file" />
      <label for="question_1001">Why do you want to work at Acme? *</label>
      <textarea id="question_1001" name="question_1001" required></textarea>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
