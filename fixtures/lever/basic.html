<!doctype html>
<!-- Synthetic, trivial Lever-shaped form for harness smoke tests. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme - Software Engineer</title>
  </head>
  <body>
    <h2>Software Engineer</h2>
    <form id="application-form" method="post" enctype="multipart/form-data">
      <label>Resume/CV <input type="file" name="resume" /></label>
      <label>Full name <input type="text" name="name" /></label>
      <label>Email <input type="email" name="email" /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>LinkedIn URL <input type="text" name="urls[LinkedIn]" /></label>
      <button id="btn-submit" type="submit" class="template-btn-submit">Submit application</button>
    </form>
  </body>
</html>
